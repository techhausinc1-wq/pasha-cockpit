<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="210 Cockpit">
<meta name="theme-color" content="#5d85a5">
<title>210 Cockpit — Pasha</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="210-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6f1;
  --surface: #ffffff;
  --surface-soft: #f0ecdf;
  --surface-hover: #fffdf6;
  --border: #e0dbcd;
  --border-soft: #ece8d9;
  --ink: #1c1a16;
  --dim: #76705f;
  --primary: #5d85a5;
  --primary-soft: #e8eff5;
  --primary-deep: #3e6585;
  --accent: #ffa62b;
  --accent-soft: #fff1d8;
  --accent-deep: #cc7e0c;
  --success: #2d7a3e;
  --success-soft: #e6f0e8;
  --warning: #b8860b;
  --warning-soft: #fbf3dc;
  --danger: #b8463a;
  --danger-soft: #fbe8e4;
  --info: #3d5da6;
  --info-soft: #e8edf7;
  --font: "Nunito", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --serif: "Fraunces", "Source Serif Pro", Georgia, serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  --label: "Nunito", -apple-system, sans-serif;
  --shadow-sm: 0 1px 2px rgba(20, 17, 13, 0.04);
  --shadow-md: 0 4px 14px rgba(20, 17, 13, 0.06);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.4;
  font-size: 14px;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* HEADER */
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  padding: 10px 16px 0;
}
.head-top {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.logo-img {
  height: 36px;
  width: auto;
  flex-shrink: 0;
}
@media (max-width: 500px) {
  .logo-img { height: 28px; }
}
.brand {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 17px;
  letter-spacing: -0.3px;
}
.brand b { color: var(--primary); font-weight: 700; }
.brand-sub {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  display: block;
  margin-top: 1px;
}
.head-spacer { flex: 1; }
.lang-toggle {
  display: flex;
  background: var(--surface-soft);
  border-radius: 6px;
  padding: 2px;
  font-family: var(--mono);
  font-size: 10px;
}
.lang-toggle button {
  background: none; border: 0; padding: 4px 8px;
  color: var(--dim); cursor: pointer; border-radius: 4px;
  font-family: inherit; font-weight: 500;
}
.lang-toggle button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.user-switcher {
  background: var(--surface-soft);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-family: var(--font);
  font-size: 12px;
  color: var(--ink);
  font-weight: 500;
}

/* NAV */
nav {
  display: flex; gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 0 16px;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  background: none; border: 0;
  padding: 10px 12px 12px;
  color: var(--dim);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
nav button.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}

/* MAIN */
main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px;
}
.view { display: none; }
.view.active { display: block; }

/* SECTION HEADS */
h2 {
  margin: 0 0 12px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
h3 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.3px;
  line-height: 1.15;
}
.lead {
  font-size: 13px;
  color: var(--dim);
  margin: 0 0 16px;
  max-width: 60ch;
}

/* CARDS */
.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card.tight { padding: 10px 12px; }
.card.attn { border-color: var(--warning); border-width: 0.5px; background: linear-gradient(180deg, var(--warning-soft), var(--surface) 40%); }
.card.danger { border-color: var(--danger); background: linear-gradient(180deg, var(--danger-soft), var(--surface) 40%); }
.card.good { border-color: var(--success); background: linear-gradient(180deg, var(--success-soft), var(--surface) 40%); }
.card-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 10px; margin-bottom: 10px;
}
.card-title {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--dim);
  font-weight: 500;
}
.card-extra { font-size: 11px; color: var(--dim); font-family: var(--mono); }

/* GRIDS */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 720px) {
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-2-uneven { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
}
@media (max-width: 719px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
}

/* STATS */
.stat {
  background: var(--surface-soft);
  border-radius: 8px;
  padding: 10px 12px;
}
.stat-num {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.5px;
}
.stat-lbl {
  font-size: 10px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--dim);
  margin-top: 2px;
}
.stat-delta {
  font-size: 11px;
  color: var(--dim);
  font-family: var(--mono);
  margin-top: 4px;
}
.stat-delta.up { color: var(--success); }
.stat-delta.down { color: var(--danger); }

/* ROWS */
.row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border-soft);
  gap: 10px;
  font-size: 13px;
}
.row:last-child { border-bottom: none; }
.row .lbl { flex: 1; }
.row .meta { font-family: var(--label); font-weight: 600; font-size: 12px; color: var(--dim); }
.row .val { font-family: var(--mono); font-size: 13px; font-weight: 600; }

/* BADGES */
.badge {
  display: inline-block;
  padding: 2px 7px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 500;
  border-radius: 10px;
  background: var(--surface-soft);
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.primary { background: var(--primary-soft); color: var(--primary-deep); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.dot::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; vertical-align: middle; }

/* PLATFORM ICONS (text-based, no emoji) */
.plat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
}
.plat.fb { background: #e7ecf7; color: #1877f2; }
.plat.ig { background: #fde8ee; color: #c2255c; }
.plat.tt { background: #e3f1f0; color: #14747a; }
.plat.ou { background: #e8f5e0; color: #4b8b2c; }
.plat.em { background: #efeef9; color: #5848b2; }
.plat.gb { background: #fdf3e0; color: #b8770a; }
.plat.wa { background: #e1f5e8; color: #128c4e; }

/* THREADS */
.thread {
  display: flex; gap: 12px;
  padding: 14px 12px;
  border-bottom: 0.5px solid var(--border-soft);
  cursor: pointer;
  align-items: flex-start;
}
.thread:hover { background: var(--surface-hover); }
.thread.unread .thread-name { font-weight: 700; }
.thread.unread::before {
  content: '';
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
  margin-top: 6px;
  flex-shrink: 0;
}
.thread:not(.unread)::before {
  content: '';
  display: inline-block;
  width: 8px; height: 8px;
  margin-top: 6px;
  flex-shrink: 0;
}
.thread-body { flex: 1; min-width: 0; }
.thread-l1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.thread-name { font-weight: 500; font-size: 14px; }
.thread-handle { color: var(--dim); font-size: 12px; font-family: var(--label); font-weight: 500; }
.thread-preview {
  font-size: 13px;
  color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.thread-meta {
  display: flex; gap: 6px; align-items: center;
  font-size: 11px;
  color: var(--dim);
  font-family: var(--label);
  font-weight: 600;
  flex-wrap: wrap;
}
.thread-time { color: var(--dim); font-family: var(--label); font-weight: 600; font-size: 12px; flex-shrink: 0; margin-left: 8px; }

/* INVENTORY */
.inv-item {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.inv-thumb {
  width: 70px; height: 70px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 22px;
  color: var(--surface);
  font-weight: 500;
  letter-spacing: -0.3px;
}
.inv-body { flex: 1; min-width: 0; }
.inv-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.inv-sku { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.inv-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); font-family: var(--label); font-weight: 600; }
.inv-price { font-family: var(--mono); font-weight: 700; font-size: 16px; text-align: right; flex-shrink: 0; color: var(--ink); }
.inv-price .cost { font-weight: 400; font-size: 11px; color: var(--dim); display: block; }

/* CUSTOMERS */
.cust-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  border-bottom: 0.5px solid var(--border-soft);
}
.cust-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--surface-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 14px;
  color: var(--primary);
  flex-shrink: 0;
}
.cust-body { flex: 1; min-width: 0; }
.cust-name { font-weight: 600; font-size: 14px; }
.cust-meta { font-size: 12px; color: var(--dim); font-family: var(--label); font-weight: 500; margin-top: 2px; }
.cust-spend { font-family: var(--mono); font-weight: 600; font-size: 14px; text-align: right; flex-shrink: 0; }

/* BUTTONS */
.btn {
  background: var(--ink);
  color: var(--surface);
  border: 0;
  padding: 10px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: #000; }
.btn.primary { background: var(--primary); }
.btn.primary:hover { background: var(--primary-deep); }
.btn.ghost { background: transparent; color: var(--ink); border: 0.5px solid var(--border); }
.btn.ghost:hover { background: var(--surface-soft); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.full { width: 100%; justify-content: center; }

/* INPUTS */
.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 14px;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--primary);
}
.textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
.field { margin-bottom: 12px; }
.field-lbl {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--dim);
  font-weight: 500;
  margin-bottom: 4px;
}

/* TEAM / PERMS */
.team-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 12px;
  border-bottom: 0.5px solid var(--border-soft);
}
.perm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.perm-tag {
  background: var(--surface-soft);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.perm-tag.on { background: var(--success-soft); color: var(--success); border-color: var(--success); }
.perm-tag .chk {
  width: 12px; height: 12px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  flex-shrink: 0;
}
.perm-tag.on .chk { background: var(--success); border-color: var(--success); }

/* ADS */
.bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 80px;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border-soft);
  font-size: 13px;
}
.bar-row:last-child { border-bottom: none; }
.bar-track {
  height: 14px;
  background: var(--surface-soft);
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 7px;
  background: var(--primary);
}
.bar-label {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
}
.bar-roas {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-align: right;
}

/* REVIEW CARD */
.review {
  padding: 12px;
  border-radius: 10px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  margin-bottom: 8px;
}
.review-stars {
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--warning);
  margin-bottom: 4px;
}
.review-stars.low { color: var(--danger); }
.review-author {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 2px;
}
.review-body { font-size: 13px; color: var(--ink); line-height: 1.5; }
.review-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* MISC */
.divider {
  height: 1px; background: var(--border-soft);
  margin: 16px 0;
}
.empty {
  padding: 20px;
  text-align: center;
  color: var(--dim);
  font-size: 13px;
  font-style: italic;
}
.kbd-hint {
  font-family: var(--mono);
  font-size: 10px;
  background: var(--surface-soft);
  padding: 2px 5px;
  border-radius: 3px;
  color: var(--dim);
  letter-spacing: 0.5px;
}
.pill-filter {
  display: inline-flex;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  margin-right: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  color: var(--dim);
}
.pill-filter.on { background: var(--primary); color: var(--surface); border-color: var(--primary); }

/* PRINT-ONLY RECEIPT */
.print-receipt { display: none; }
@media print {
  body > * { display: none !important; }
  body > .print-receipt { display: block !important; }
  .print-receipt {
    font-family: 'Plus Jakarta Sans', Helvetica, Arial, sans-serif;
    color: #000;
    background: #fff;
    padding: 28px 36px;
    font-size: 11pt;
    line-height: 1.4;
    max-width: 8.5in;
    margin: 0 auto;
  }
  .pr-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 14px; margin-bottom: 18px; }
  .pr-head img { height: 56px; }
  .pr-biz { text-align: right; font-size: 10pt; line-height: 1.5; }
  .pr-biz b { font-size: 12pt; }
  .pr-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; font-size: 10pt; }
  .pr-meta .lbl { font-weight: 700; text-transform: uppercase; font-size: 8pt; letter-spacing: 1px; color: #666; margin-bottom: 2px; }
  .pr-items { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .pr-items th, .pr-items td { border-bottom: 0.5px solid #999; padding: 6pt 8pt; text-align: left; font-size: 10pt; }
  .pr-items th { background: #f0f0f0; font-size: 8pt; text-transform: uppercase; letter-spacing: 1px; }
  .pr-items td.r, .pr-items th.r { text-align: right; }
  .pr-totals { margin-left: auto; width: 280px; font-size: 11pt; }
  .pr-totals div { display: flex; justify-content: space-between; padding: 3pt 0; }
  .pr-totals .grand { font-weight: 700; font-size: 14pt; border-top: 2px solid #000; padding-top: 6pt; margin-top: 4pt; }
  .pr-sig { margin-top: 28px; display: flex; gap: 36px; }
  .pr-sig-block { flex: 1; }
  .pr-sig-line { border-bottom: 1px solid #000; height: 28px; margin-bottom: 4px; }
  .pr-sig-lbl { font-size: 9pt; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  .pr-foot { margin-top: 22px; padding-top: 12px; border-top: 1px solid #999; font-size: 8.5pt; color: #444; line-height: 1.45; }
  .pr-thanks { text-align: center; font-family: 'Fraunces', Georgia, serif; font-size: 14pt; font-style: italic; margin-top: 14px; }
  @page { size: letter; margin: 0.4in; }
}

/* SCROLL CONTAINERS */
.scroll-x {
  overflow-x: auto;
  scrollbar-width: thin;
  white-space: nowrap;
  margin: 0 -16px;
  padding: 0 16px;
}
.scroll-x::-webkit-scrollbar { height: 4px; }

/* MORNING HERO */
.greet-strip {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
  color: var(--surface);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}
.greet-name {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.5px;
  line-height: 1.1;
  margin-bottom: 6px;
}
.greet-name em { font-style: italic; opacity: 0.9; }
.greet-date {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: 0.8;
  margin-bottom: 14px;
}
.greet-strip .stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.greet-strip .stat-cell {
  border-left: 1px solid rgba(255,255,255,0.25);
  padding-left: 10px;
}

/* -------- RENDER ROOT -------- */
function setLang(l) {
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  document.getElementById('lang-es').classList.toggle('active', l === 'es');
  document.getElementById('lang-ru').classList.toggle('active', l === 'ru');
  document.getElementById('brand-sub').textContent = t('brand_sub');
  renderNav();
  renderView();
}

function setView(v) {
  CURRENT_VIEW = v;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === `view-${v}`));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  renderView();
  window.scrollTo(0, 0);
}

function switchUser(uid) {
  CURRENT_USER = USERS.find(u => u.id === uid);
  renderView();
}

function userCanSee(modPerm) {
  return CURRENT_USER.perms.includes(modPerm);
}

/* -------- NAV -------- */
function renderNav() {
  const tabs = [
    ['morning', 'nav_morning'],
    ['inbox', 'nav_inbox'],
    ['inventory', 'nav_inventory'],
    ['invoices', 'nav_invoices'],
    ['customers', 'nav_customers'],
    ['ads', 'nav_ads'],
    ['scout', 'nav_scout'],
    ['reels', 'nav_reels'],
    ['team', 'nav_team']
  ];
  document.getElementById('nav').innerHTML = tabs.map(([v, k]) =>
    `<button data-view="${v}" class="${v === CURRENT_VIEW ? 'active' : ''}" onclick="setView('${v}')">${t(k)}</button>`
  ).join('');
}

/* -------- USER SWITCHER -------- */
function renderUserSwitcher() {
  document.getElementById('user-switcher').innerHTML =
    USERS.map(u => `<option value="${u.id}" ${u.id === CURRENT_USER.id ? 'selected' : ''}>${u.name} · ${u.role}</option>`).join('');
}

/* ============================================================
   INBOX VIEW — multi-account unified messages
   ============================================================ */
function renderInbox() {
  const canAll = userCanSee('inbox_all');
  let threads = THREADS.slice();
  if (!canAll) threads = threads.filter(t => t.assigned === CURRENT_USER.id);
  if (INBOX_FILTER.platform !== 'all') threads = threads.filter(t => t.platform === INBOX_FILTER.platform);
  if (INBOX_FILTER.account !== 'all') threads = threads.filter(t => t.account === INBOX_FILTER.account);
  if (INBOX_FILTER.loc !== 'all') threads = threads.filter(t => t.loc === INBOX_FILTER.loc);
  if (INBOX_FILTER.assigned !== 'all') {
    if (INBOX_FILTER.assigned === 'unassigned') threads = threads.filter(t => !t.assigned);
    else threads = threads.filter(t => t.assigned === INBOX_FILTER.assigned);
  }
  // sort: unread first, then by recency (time string approximation)
  threads.sort((a, b) => {
    if (a.unread !== b.unread) return b.unread - a.unread;
    return 0;
  });

  const unreadCount = THREADS.filter(t => t.unread).length;

  const queuedCount = THREADS.filter(t => t.intent === 'auto_queued').length;
  const followupCount = THREADS.filter(t => t.intent === 'auto_followup').length;
  const html = `
    <h3>${t('nav_inbox')}</h3>
    <p class="lead">${unreadCount === 0 ? t('inbox_quiet') : `<b>${unreadCount}</b> ${t('inbox_busy_msgs')} · ${ACCOUNTS.length} ${t('all_accounts').toLowerCase()}`}</p>

    ${queuedCount > 0 || followupCount > 0 ? `
    <div class="card attn" style="border-left:3px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 70%);">
      <div class="card-head" style="margin-bottom:6px;">
        <span style="font-family:var(--label); font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:0.6px; color:var(--accent-deep);">${t('auto_reply_card')}</span>
        <span style="font-family:var(--label); font-weight:700; font-size:11px; color:var(--dim);">${queuedCount} ${t('auto_reply_queue').toLowerCase()}</span>
      </div>
      <div style="font-size:12px; color:var(--dim); line-height:1.5;">${t('auto_reply_intro')}</div>
    </div>
    ` : ''}

    <div class="scroll-x" style="margin-bottom:8px;">
      <div style="display:inline-block;">
        ${renderPillFilter('platform', 'all', t('all_accounts'))}
        ${['fb','ig','tt','ou','em','gb','wa'].map(p => renderPillFilter('platform', p, p.toUpperCase())).join('')}
      </div>
    </div>
    <div class="scroll-x" style="margin-bottom:12px;">
      <div style="display:inline-block;">
        ${renderPillFilter('loc', 'all', 'All locations')}
        ${renderPillFilter('loc', 'sa', 'San Antonio only')}
        ${renderPillFilter('loc', 'out', 'Out-of-area')}
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
      <select class="select" style="width:auto; flex:1; min-width:160px;" onchange="INBOX_FILTER.account=this.value; renderInbox();">
        <option value="all">${t('all_accounts')}</option>
        ${ACCOUNTS.map(a => `<option value="${a.id}" ${INBOX_FILTER.account === a.id ? 'selected' : ''}>${a.label}</option>`).join('')}
      </select>
      ${canAll ? `
      <select class="select" style="width:auto; flex:1; min-width:160px;" onchange="INBOX_FILTER.assigned=this.value; renderInbox();">
        <option value="all">${t('filter_assigned')}: ${t('all_accounts').toLowerCase()}</option>
        <option value="unassigned">${t('filter_assigned')}: ${t('msg_unassigned')}</option>
        ${USERS.filter(u => u.role !== 'delivery' && u.role !== 'warehouse').map(u => `<option value="${u.id}" ${INBOX_FILTER.assigned === u.id ? 'selected' : ''}>${t('filter_assigned')}: ${u.name}</option>`).join('')}
      </select>
      ` : ''}
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      ${threads.length === 0 ? `<div class="empty">${t('no_threads')}</div>` : threads.map(th => renderThread(th)).join('')}
    </div>
  `;
  document.getElementById('view-inbox').innerHTML = html;
}

function renderPillFilter(field, val, label) {
  const on = INBOX_FILTER[field] === val;
  return `<button class="pill-filter ${on ? 'on' : ''}" onclick="INBOX_FILTER.${field}='${val}'; renderInbox();">${label}</button>`;
}

function renderThread(th) {
  const acct = ACCOUNTS.find(a => a.id === th.account);
  const assignee = th.assigned ? USERS.find(u => u.id === th.assigned) : null;
  const locBadge = th.loc === 'sa'
    ? '<span class="badge" style="background:#e8f0e3; color:#3d6b2e;">SA</span>'
    : th.loc === 'out'
      ? '<span class="badge" style="background:#fae6dc; color:#a04020;">OUT-OF-AREA</span>'
      : '';
  const intentBadge = {
    serious_lead: `<span class="badge primary">${t('serious_lead')}</span>`,
    finance_q: `<span class="badge info">${t('finance_q')}</span>`,
    delivery_q: `<span class="badge info">${t('delivery_q')}</span>`,
    price_q: `<span class="badge">${t('price_q')}</span>`,
    spam: `<span class="badge danger">${t('spam')}</span>`,
    follow_up_due: `<span class="badge warning">${t('follow_up_due')}</span>`,
    review_good: `<span class="badge success">★★★★★</span>`,
    review_bad: `<span class="badge danger">★</span>`,
    auto_queued: `<span class="badge" style="background:var(--accent-soft); color:var(--accent-deep);">${t('auto_reply_queue')} · ${t('fires_in')} ${th.auto_reply ? th.auto_reply.fires_in : 30}${t('sec')}</span>`,
    auto_followup: `<span class="badge" style="background:var(--accent); color:white;">⚡ ${t('auto_followup')}</span>`
  }[th.intent] || '';
  return `
    <div class="thread ${th.unread ? 'unread' : ''}" onclick="openThread('${th.id}')">
      <div class="thread-body">
        <div class="thread-l1">
          <span class="plat ${th.platform}">${th.platform.toUpperCase()}</span>
          <span class="thread-name">${th.customer}</span>
          <span class="thread-handle">${acct ? acct.label : ''}</span>
        </div>
        <div class="thread-preview">${th.preview}</div>
        <div class="thread-meta">
          ${locBadge}
          ${intentBadge}
          ${assignee ? `<span class="badge">${t('msg_assigned_to')}: ${assignee.name}</span>` : `<span class="badge warning">${t('msg_unassigned')}</span>`}
        </div>
      </div>
      <div class="thread-time">${th.time}</div>
    </div>
  `;
}

function openThread(id) {
  const th = THREADS.find(x => x.id === id);
  const acct = ACCOUNTS.find(a => a.id === th.account);
  openModal(`
    <div class="modal-head">
      <div>
        <div style="font-weight:600; font-size:16px;">${th.customer}</div>
        <div style="font-size:11px; color:var(--dim); font-family:var(--mono); margin-top:2px;">${acct.label} · ${th.handle}</div>

    </div>
  `);
}

function generateDraftReply(th) {
  if (th.intent === 'price_q' && th.lang === 'es') {
    return `Hola ${th.customer.split(' ')[0]}, sí lo tenemos en stock. El precio es $1,299 y manejamos financiamiento sin crédito desde $50/mes. ¿Te paso fotos o cuándo puedes venir a verlo?`;
  }
  if (th.intent === 'price_q' && th.lang === 'en') {
    return `Hi ${th.customer.split(' ')[0]}, yes — still available. Price is $1,299 and we offer no-credit financing from $50/month. Want me to send photos or schedule a viewing?`;
  }
  if (th.intent === 'finance_q' && th.lang === 'en') {
    return `Hi ${th.customer.split(' ')[0]} — we work with American Finance, Acima, and Snap. We can pre-qualify in 60 seconds and it doesn't affect your credit. Want me to send the link?`;
  }
  if (th.intent === 'finance_q' && th.lang === 'es') {
    return `Hola ${th.customer.split(' ')[0]} — financiamos con American Finance, Acima y Snap. Te puedo pre-aprobar en 60 segundos y no afecta tu crédito. ¿Te paso el enlace?`;
  }
  if (th.intent === 'delivery_q' && th.lang === 'es') {
    return `Sí, entregamos en esa zona. La entrega es $49 e instalamos sin costo. ¿Qué día te queda mejor?`;
  }
  if (th.intent === 'delivery_q' && th.lang === 'en') {
    return `Yes, we deliver to that area. Delivery is $49 and we set up at no extra cost. What day works for you?`;
  }
  if (th.intent === 'review_bad') {
    return `${th.customer}, I'm so sorry the delivery experience didn't meet expectations. I'm the owner — can I call you directly to make this right? Please reply with the best time and I'll personally handle it.`;
  }
  if (th.intent === 'review_good') {
    return `Thank you so much, ${th.customer}! Christian will love hearing this. We appreciate your business and look forward to seeing you again.`;
  }
  return `Hi ${th.customer.split(' ')[0]}, thanks for reaching out. Can you tell me a bit more about what you're looking for?`;
}

function openReviewReply(id) {
  openThread(id);
}

function addInvItem(sku) {
  const it = INVENTORY.find(x => x.sku === sku);
  const ex = NEW_INV.items.find(x => x.sku === sku);
  if (ex) ex.qty += 1;
  else NEW_INV.items.push({ sku: it.sku, name: it.name, price: it.price, qty: 1 });
  renderNewInvoice();
}
function incInvItem(idx) { NEW_INV.items[idx].qty += 1; renderNewInvoice(); }
function decInvItem(idx) {
  NEW_INV.items[idx].qty -= 1;
  if (NEW_INV.items[idx].qty <= 0) NEW_INV.items.splice(idx, 1);
  renderNewInvoice();
}
function finalizeNewInvoice() {
  if (NEW_INV.items.length === 0) return;
  // If finance method selected, route through the finance application flow first
  if (NEW_INV.method && NEW_INV.method.startsWith('finance_')) {
    openFinanceApp(NEW_INV.method);
    return;
  }
  // Otherwise, save + show print/sign confirmation
  const newId = 'INV-2026-' + String(900 + Math.floor(Math.random() * 99)).padStart(4, '0');
  const total = NEW_INV.items.reduce((s,x) => s + x.price * x.qty, 0);
  const inv = {
    id: newId,
    date: TODAY,
    customer: NEW_INV.customer || 'Walk-in customer',
    cust_id: null,
    total,
    items: NEW_INV.items.slice(),
    method: NEW_INV.method,
    status: NEW_INV.method === 'cash' ? 'paid' : NEW_INV.method === 'card' ? 'paid' : 'pending',
    source: 'digital',
    signed: false,

  };
  INVENTORY_LAST_NEW = inv;
  INVOICES.unshift(inv);
  closeModal();

  setTimeout(() => openPostSaleActions(inv), 100);
}

function downloadFinancialsCSV() {
  const rows = [];
  rows.push(['# 210 Discount Furniture — Financials report']);
  rows.push(['# Generated', new Date().toISOString()]);
  rows.push(['# Period', 'Last 30 days ending ' + TODAY]);
  rows.push([]);
  rows.push(['== AD SPEND BY CHANNEL ==']);
  rows.push(['Channel','Spend','Revenue','Leads','Sales','ROAS']);
  ADS.forEach(a => rows.push([a.channel, a.spend, a.revenue, a.leads, a.attributed_sales, a.spend > 0 ? (a.revenue/a.spend).toFixed(2) : 'INF']));
  rows.push([]);
  rows.push(['== PER-ACCOUNT BREAKDOWN ==']);
  rows.push(['Account','Spend','Messages','Sales','Revenue','ROAS','CAC']);
  const acctData = [
    ['210 Discount Furniture (FB)', 1850, 38, 7, 8900],
    ['210 Discount Mattress (FB)', 920, 19, 4, 4400],
    ['210 Muebles en Español (FB)', 780, 22, 5, 5200],
    ['210 Furniture Outlet (FB)', 410, 9, 2, 1900],
    ['FB Marketplace · SA', 0, 51, 5, 4200],
    ['@210discount (IG)', 1800, 58, 7, 7200],
    ['@210discountfurniture (TT)', 600, 47, 1, 1100],
    ['@210mueblesatx (TT)', 300, 26, 1, 700],
    ['OfferUp', 0, 33, 3, 2400],
    ['Google Search Ads', 2400, 41, 9, 9600],
    ['Google Business Profile (free)', 0, 28, 6, 5400]
  ];
  acctData.forEach(([a, sp, m, s, r]) => {
    const roas = sp > 0 ? (r/sp).toFixed(2) : 'INF';
    const cac = s > 0 ? Math.round(sp/s) : 0;
    rows.push([a, sp, m, s, r, roas, cac]);
  });
  rows.push([]);
  rows.push(['== PER-REP PERFORMANCE ==']);
  rows.push(['Rep','Role','Messages','Sales','Gross','Avg Ticket']);
  USERS.forEach(u => {
    const invs = INVOICES.filter(i => i.salesperson === u.id);
    const gross = invs.reduce((s, i) => s + i.total, 0);
    const msgs = THREADS.filter(t => t.assigned === u.id).length;
    rows.push([u.name, u.role, msgs, invs.length, gross, invs.length > 0 ? Math.round(gross/invs.length) : 0]);
  });
  rows.push([]);
  rows.push(['== INVOICES ==']);
  rows.push(['Invoice ID','Date','Customer','Items','Total','Method','Status','Source','Salesperson']);
  INVOICES.forEach(i => rows.push([i.id, i.date, i.customer, i.items.length, i.total, i.method, i.status, i.source, i.salesperson]));
  if (userCanSee('money')) {
    rows.push([]);
    rows.push(['== CASH POSITION (owner-only) ==']);
    rows.push(['Bank balance', BANK.balance]);
    rows.push(['Pending vendor payments', BANK.pending_payments]);
    rows.push(['Scheduled 30-day outflow', BANK.scheduled_outflow_30d]);
    rows.push(['Total invoice revenue', INVOICES.reduce((s,i) => s+i.total, 0)]);
  }
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell == null ? '' : cell);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '210-cockpit-financials-' + TODAY + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      ${opp.contact.phone && opp.contact.phone !== 'n/a' ? `<a class="btn ghost" style="flex:1; text-align:center; text-decoration:none; color:var(--ink);" href="tel:${opp.contact.phone.replace(/[^0-9+]/g, '')}">Call</a>` : ''}
      <button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
    </div>
  `);
}
function scoutGmail(id) {
  const opp = SCOUT_OPPS.find(x => x.id === id);
  const body = document.getElementById('scout-script').value;
  const lines = body.split('\n');
  let subject = 'Inquiry from 210 Discount Furniture';
  // Pull subject if the script has "Subject: ..." as the first line
  if (lines[0].toLowerCase().startsWith('subject:')) {
    subject = lines[0].substring(8).trim();
    lines.shift();
    while (lines[0] === '') lines.shift();
  }
  const finalBody = lines.join('\n');
  const url = 'https://mail.google.com/mail/?view=cm&fs=1'
    + '&to=' + encodeURIComponent(opp.contact.email)
    + '&su=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(finalBody);
  try { navigator.clipboard.writeText('To: ' + opp.contact.email + '\nSubject: ' + subject + '\n\n' + finalBody); } catch (e) {}
  window.open(url, '_blank', 'noopener');
  closeModal();
}

function renderTeam() {
  if (!userCanSee('team')) {
    document.getElementById('view-team').innerHTML = `<div class="empty">${t('permissions')} — needs <code>team</code></div>`;
    return;
  }
  const allPerms = ['inbox_all','inbox_assigned','inventory_read','inventory_write','customers','customers_email','ads','team','money','reviews'];
  const html = `
    <h3>${t('team_management')}</h3>
    <p class="lead">${t('team_intro')}</p>

    ${USERS.map(u => `
      <div class="card">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:12px;">
          <div class="cust-avatar" style="width:42px; height:42px; font-size:16px;">${u.avatar}</div>

            <div style="font-weight:600; font-size:15px;">${u.name}</div>
            <div style="font-size:11px; color:var(--dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:1px;">${u.role}</div>
          </div>
          <span class="badge primary">${u.perms.length} ${t('permissions').toLowerCase()}</span>
        </div>
        <div class="perm-grid">
          ${allPerms.map(p => {
            const on = u.perms.includes(p);
            const isOwnerExclusive = (p === 'team' || p === 'money');
            const editable = u.id !== CURRENT_USER.id && !(isOwnerExclusive && CURRENT_USER.role !== 'owner');
            return `<div class="perm-tag ${on ? 'on' : ''}" ${editable ? `onclick="togglePerm('${u.id}','${p}')"` : 'style="opacity:0.6;cursor:not-allowed;"'}><span class="chk"></span>${t('perm_' + p) || p}</div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}

    <div class="card" style="background:var(--surface-soft); border-style:dashed;">
      <div style="font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--dim); margin-bottom:6px;">¿Cómo funciona?</div>
      <div style="font-size:13px; line-height:1.5;">El propietario (Pasha) puede ajustar permisos de cualquier usuario. El admin (Ivan) puede ajustar a todos excepto al propietario. Los demás no pueden ver esta pantalla. Cada permiso controla qué módulos puede ver y qué acciones puede hacer.</div>
    </div>
  `;
  document.getElementById('view-team').innerHTML = html;
}

function togglePerm(uid, perm) {
  const u = USERS.find(x => x.id === uid);
  if (u.perms.includes(perm)) u.perms = u.perms.filter(p => p !== perm);
  else u.perms.push(perm);
  renderTeam();
}

/* -------- DATE HELPER -------- */
function formatDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  if (LANG === 'es') {
    const days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
  } else if (LANG === 'ru') {
    const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
  } else {
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW reg failed', err));
  });
}

window.addEventListener('beforeinstallprompt', (e) => {

});
