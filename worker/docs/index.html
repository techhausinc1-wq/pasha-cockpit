<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="210 Cockpit">
<meta name="theme-color" content="#5d85a5">
<title>210 Cockpit — Pavil Nimerovsky</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="210-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6f1;
  --surface: #ffffff;
  --surface-soft: #f0ecdf;
  --surface-hover: #fffdf6;
  --border: #e0dbcd;
  --border-soft: #ece8d9;
  --ink: #1c1a16;
  --dim: #76705f;
  --primary: #5d85a5;
  --primary-soft: #e8eff5;
  --primary-deep: #3e6585;
  --accent: #ffa62b;
  --accent-soft: #fff1d8;
  --accent-deep: #cc7e0c;
  --success: #2d7a3e;
  --success-soft: #e6f0e8;
  --warning: #b8860b;
  --warning-soft: #fbf3dc;
  --danger: #b8463a;
  --danger-soft: #fbe8e4;
  --info: #3d5da6;
  --info-soft: #e8edf7;
  --font: "Nunito", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --serif: "Fraunces", "Source Serif Pro", Georgia, serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  --label: "Nunito", -apple-system, sans-serif;
  --shadow-sm: 0 1px 2px rgba(20, 17, 13, 0.04);
  --shadow-md: 0 4px 14px rgba(20, 17, 13, 0.06);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.4;
  font-size: 14px;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* HEADER */
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  padding: 10px 16px 0;
}
.head-top {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.logo-img {
  height: 36px;
  width: auto;
  flex-shrink: 0;
}
@media (max-width: 500px) {
  .logo-img { height: 28px; }
}
.brand {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 17px;
  letter-spacing: -0.3px;
}
.brand b { color: var(--primary); font-weight: 700; }
.brand-sub {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  display: block;
  margin-top: 1px;
}
.head-spacer { flex: 1; }
.lang-toggle {
  display: flex;
  background: var(--surface-soft);
  border-radius: 6px;
  padding: 2px;
  font-family: var(--mono);
  font-size: 10px;
}
.lang-toggle button {
  background: none; border: 0; padding: 4px 8px;
  color: var(--dim); cursor: pointer; border-radius: 4px;
  font-family: inherit; font-weight: 500;
}
.lang-toggle button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.user-switcher {
  background: var(--surface-soft);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-family: var(--font);
  font-size: 12px;
  color: var(--ink);
  font-weight: 500;
}
.notif-toggle {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--success-soft); color: var(--success);
  border: 0.5px solid var(--success);
  border-radius: 6px; padding: 5px 9px;
  font-family: var(--label); font-weight: 700; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.5px;
  cursor: pointer; transition: all 0.15s;
}
.notif-toggle.off { background: var(--surface-soft); color: var(--dim); border-color: var(--border); }
.notif-toggle .notif-bell { font-size: 13px; line-height: 1; }
.notif-toggle.off .notif-bell { filter: grayscale(1); opacity: 0.55; }
@media (max-width: 600px) { .notif-toggle .notif-label { display: none; } }

/* In-app message toast */
.toast-container {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--surface); border: 0.5px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 10px; padding: 12px 14px;
  box-shadow: 0 8px 24px rgba(20,17,13,0.18);
  min-width: 280px; max-width: 380px;
  pointer-events: auto;
  display: flex; gap: 10px; align-items: flex-start;
  animation: toast-in 0.3s ease-out;
}
@keyframes toast-in { from { transform: translateX(420px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast .toast-bell { font-size: 18px; flex-shrink: 0; animation: bell-wiggle 0.5s ease; }
@keyframes bell-wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } }
.toast .toast-body { flex: 1; min-width: 0; }
.toast .toast-title { font-weight: 700; font-size: 13px; line-height: 1.3; margin-bottom: 3px; }
.toast .toast-meta { font-family: var(--label); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); margin-bottom: 4px; }
.toast .toast-preview { font-size: 12px; color: var(--dim); line-height: 1.4; }
.toast .toast-actions { display: flex; gap: 6px; margin-top: 8px; }
.toast .toast-btn { background: var(--primary); color: white; border: 0; padding: 4px 10px; border-radius: 4px; font-family: var(--label); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer; }
.toast .toast-btn.ghost { background: transparent; color: var(--dim); border: 0.5px solid var(--border); }

/* NAV */
.nav-wrap {
  position: relative;
  margin: 0 -16px;
}
/* Nav has more tabs than fit on a phone screen and scrolls horizontally --
   scrollbar-width:none hides the only native hint that it scrolls at all,
   so a sales associate on the floor has no way to discover "Invoices" and
   everything after it exists. This fade is the affordance instead. */
.nav-wrap::after {
  content: '';
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 28px;
  background: linear-gradient(to right, transparent, var(--surface) 75%);
  pointer-events: none;
}
nav {
  display: flex; gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 16px;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  background: none; border: 0;
  padding: 10px 12px 12px;
  color: var(--dim);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
nav button.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}

/* MAIN */
main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px;
}
.view { display: none; }
.view.active { display: block; }

/* SECTION HEADS */
h2 {
  margin: 0 0 12px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
h3 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.3px;
  line-height: 1.15;
}
.lead {
  font-size: 13px;
  color: var(--dim);
  margin: 0 0 16px;
  max-width: 60ch;
}

/* CARDS */
.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card.tight { padding: 10px 12px; }
.card.attn { border-color: var(--warning); border-width: 0.5px; background: linear-gradient(180deg, var(--warning-soft), var(--surface) 40%); }
.card.danger { border-color: var(--danger); background: linear-gradient(180deg, var(--danger-soft), var(--surface) 40%); }
.card.good { border-color: var(--success); background: linear-gradient(180deg, var(--success-soft), var(--surface) 40%); }
.card-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 10px; margin-bottom: 10px;
}
.card-title {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--dim);
  font-weight: 500;
}
.card-extra { font-size: 11px; color: var(--dim); font-family: var(--mono); }

/* GRIDS */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 720px) {
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-2-uneven { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
}
@media (max-width: 719px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
}

/* STATS */
.stat {
  background: var(--surface-soft);
  border-radius: 8px;
  padding: 10px 12px;
}
.stat-num {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.5px;
}
.stat-lbl {
  font-size: 10px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--dim);
  margin-top: 2px;
}
.stat-delta {
  font-size: 11px;
  color: var(--dim);
  font-family: var(--mono);
  margin-top: 4px;
}
.stat-delta.up { color: var(--success); }
.stat-delta.down { color: var(--danger); }

/* ROWS */
.row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border-soft);
  gap: 10px;
  font-size: 13px;
}
.row:last-child { border-bottom: none; }
.row .lbl { flex: 1; }
.row .meta { font-family: var(--label); font-weight: 600; font-size: 12px; color: var(--dim); }
.row .val { font-family: var(--mono); font-size: 13px; font-weight: 600; }

/* BADGES */
.badge {
  display: inline-block;
  padding: 2px 7px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 500;
  border-radius: 10px;
  background: var(--surface-soft);
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.primary { background: var(--primary-soft); color: var(--primary-deep); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.dot::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; vertical-align: middle; }

/* PLATFORM ICONS (text-based, no emoji) */
.plat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
}
.plat.fb { background: #e7ecf7; color: #1877f2; }
.plat.ig { background: #fde8ee; color: #c2255c; }
.plat.tt { background: #e3f1f0; color: #14747a; }
.plat.ou { background: #e8f5e0; color: #4b8b2c; }
.plat.em { background: #efeef9; color: #5848b2; }
.plat.gb { background: #fdf3e0; color: #b8770a; }
.plat.wa { background: #e1f5e8; color: #128c4e; }

/* THREADS */
.thread {
  display: flex; gap: 12px;
  padding: 14px 12px;
  border-bottom: 0.5px solid var(--border-soft);
  cursor: pointer;
  align-items: flex-start;
}
.thread:hover { background: var(--surface-hover); }
.thread.unread .thread-name { font-weight: 700; }
.thread.unread::before {
  content: '';
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
  margin-top: 6px;
  flex-shrink: 0;
}
.thread:not(.unread)::before {
  content: '';
  display: inline-block;
  width: 8px; height: 8px;
  margin-top: 6px;
  flex-shrink: 0;
}
.thread-body { flex: 1; min-width: 0; }
.thread-l1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.thread-name { font-weight: 500; font-size: 14px; }
.thread-handle { color: var(--dim); font-size: 12px; font-family: var(--label); font-weight: 500; }
.thread-preview {
  font-size: 13px;
  color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.thread-meta {
  display: flex; gap: 6px; align-items: center;
  font-size: 11px;
  color: var(--dim);
  font-family: var(--label);
  font-weight: 600;
  flex-wrap: wrap;
}
.thread-time { color: var(--dim); font-family: var(--label); font-weight: 600; font-size: 12px; flex-shrink: 0; margin-left: 8px; }

/* INVENTORY */
.inv-item {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.inv-thumb {
  width: 70px; height: 70px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 22px;
  color: var(--surface);
  font-weight: 500;
  letter-spacing: -0.3px;
}
.inv-body { flex: 1; min-width: 0; }
.inv-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.inv-sku { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.inv-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); font-family: var(--label); font-weight: 600; }
.inv-price { font-family: var(--mono); font-weight: 700; font-size: 16px; text-align: right; flex-shrink: 0; color: var(--ink); }
.inv-price .cost { font-weight: 400; font-size: 11px; color: var(--dim); display: block; }

/* CUSTOMERS */
.cust-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  border-bottom: 0.5px solid var(--border-soft);
}
.cust-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--surface-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 14px;
  color: var(--primary);
  flex-shrink: 0;
}
.cust-body { flex: 1; min-width: 0; }
.cust-name { font-weight: 600; font-size: 14px; }
.cust-meta { font-size: 12px; color: var(--dim); font-family: var(--label); font-weight: 500; margin-top: 2px; }
.cust-spend { font-family: var(--mono); font-weight: 600; font-size: 14px; text-align: right; flex-shrink: 0; }

/* BUTTONS */
.btn {
  background: var(--ink);
  color: var(--surface);
  border: 0;
  padding: 10px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: #000; }
.btn.primary { background: var(--primary); }
.btn.primary:hover { background: var(--primary-deep); }
.btn.ghost { background: transparent; color: var(--ink); border: 0.5px solid var(--border); }
.btn.ghost:hover { background: var(--surface-soft); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.full { width: 100%; justify-content: center; }

/* INPUTS */
.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 14px;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--primary);
}
.textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
.field { margin-bottom: 12px; }
.field-lbl {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--dim);
  font-weight: 500;
  margin-bottom: 4px;
}

/* TEAM / PERMS */
.team-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 12px;
  border-bottom: 0.5px solid var(--border-soft);
}
.perm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.perm-tag {
  background: var(--surface-soft);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.perm-tag.on { background: var(--success-soft); color: var(--success); border-color: var(--success); }
.perm-tag .chk {
  width: 12px; height: 12px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  flex-shrink: 0;
}
.perm-tag.on .chk { background: var(--success); border-color: var(--success); }

/* ADS */
.bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 80px;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border-soft);
  font-size: 13px;
}
.bar-row:last-child { border-bottom: none; }
.bar-track {
  height: 14px;
  background: var(--surface-soft);
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 7px;
  background: var(--primary);
}
.bar-label {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
}
.bar-roas {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-align: right;
}

/* REVIEW CARD */
.review {
  padding: 12px;
  border-radius: 10px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  margin-bottom: 8px;
}
.review-stars {
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--warning);
  margin-bottom: 4px;
}
.review-stars.low { color: var(--danger); }
.review-author {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 2px;
}
.review-body { font-size: 13px; color: var(--ink); line-height: 1.5; }
.review-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* MISC */
.divider {
  height: 1px; background: var(--border-soft);
  margin: 16px 0;
}
.empty {
  padding: 20px;
  text-align: center;
  color: var(--dim);
  font-size: 13px;
  font-style: italic;
}
.kbd-hint {
  font-family: var(--mono);
  font-size: 10px;
  background: var(--surface-soft);
  padding: 2px 5px;
  border-radius: 3px;
  color: var(--dim);
  letter-spacing: 0.5px;
}
.pill-filter {
  display: inline-flex;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  margin-right: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  color: var(--dim);
}
.pill-filter.on { background: var(--primary); color: var(--surface); border-color: var(--primary); }

/* PRINT-ONLY RECEIPT */
.print-receipt { display: none; }
@media print {
  body > * { display: none !important; }
  body > .print-receipt { display: block !important; }
  .print-receipt {
    font-family: 'Plus Jakarta Sans', Helvetica, Arial, sans-serif;
    color: #000;
    background: #fff;
    padding: 28px 36px;
    font-size: 11pt;
    line-height: 1.4;
    max-width: 8.5in;
    margin: 0 auto;
  }
  .pr-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 14px; margin-bottom: 18px; }

  .pr-biz { text-align: right; font-size: 10pt; line-height: 1.5; }
  .pr-biz b { font-size: 12pt; }
  .pr-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; font-size: 10pt; }
  .pr-meta .lbl { font-weight: 700; text-transform: uppercase; font-size: 8pt; letter-spacing: 1px; color: #666; margin-bottom: 2px; }
  .pr-items { width: 100%; border-collapse: collapse; margin-bottom: 14px; }

  .pr-totals div { display: flex; justify-content: space-between; padding: 3pt 0; }
  .pr-totals .grand { font-weight: 700; font-size: 14pt; border-top: 2px solid #000; padding-top: 6pt; margin-top: 4pt; }
  .pr-sig { margin-top: 28px; display: flex; gap: 36px; }
  .pr-sig-block { flex: 1; }
  .pr-sig-line { border-bottom: 1px solid #000; height: 28px; margin-bottom: 4px; }
  .pr-sig-lbl { font-size: 9pt; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  .pr-foot { margin-top: 22px; padding-top: 12px; border-top: 1px solid #999; font-size: 8.5pt; color: #444; line-height: 1.45; }
  .pr-thanks { text-align: center; font-family: 'Fraunces', Georgia, serif; font-size: 14pt; font-style: italic; margin-top: 14px; }
  /* Two-copy print: Merchant copy on page 1, Customer copy on page 2. */
  .pr-page { page-break-after: always; }
  .pr-page:last-child { page-break-after: auto; }
  .pr-copy-tag {
    font-family: 'Plus Jakarta Sans', Helvetica, sans-serif;
    font-weight: 800; font-size: 9pt;
    text-transform: uppercase; letter-spacing: 1.4pt;
    background: #000; color: #fff;
    padding: 4pt 10pt; border-radius: 3pt;
    display: inline-block; margin-bottom: 10pt;
  }
  @page { size: letter; margin: 0.4in; }
}

/* SCROLL CONTAINERS */
.scroll-x {
  overflow-x: auto;
  scrollbar-width: thin;
  white-space: nowrap;
  margin: 0 -16px;
  padding: 0 16px;
}
.scroll-x::-webkit-scrollbar { height: 4px; }

/* MORNING HERO */
.greet-strip {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
  color: var(--surface);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}
.greet-name {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.5px;
  line-height: 1.1;
  margin-bottom: 6px;
}
.greet-name em { font-style: italic; opacity: 0.9; }
.greet-date {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: 0.8;
  margin-bottom: 14px;
}
.greet-strip .stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.greet-strip .stat-cell {
  border-left: 1px solid rgba(255,255,255,0.25);
  padding-left: 10px;
}
.greet-strip .stat-cell:first-child { border-left: none; padding-left: 0; }
.greet-strip .stat-cell .n {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
}
.greet-strip .stat-cell .l {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.85;
  margin-top: 2px;
  font-family: var(--mono);
}

/* COMPOSE MODAL */
.modal-back {
  position: fixed; inset: 0;
  background: rgba(20,17,13,0.5);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-back.on { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 14px;
  max-width: 520px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.modal-close {
  background: none; border: 0;
  font-size: 22px;
  cursor: pointer;
  color: var(--dim);
  line-height: 1;
  padding: 4px;
}

/* RESPONSIVE TWEAKS */
@media (max-width: 600px) {
  .greet-strip .stat-row { grid-template-columns: repeat(2, 1fr); }
  .greet-strip .stat-cell:nth-child(3) { border-left: none; padding-left: 0; }
  h3 { font-size: 19px; }
  .bar-row { grid-template-columns: 90px 1fr 60px; gap: 6px; }
  .greet-strip { padding: 16px; }
}

/* login gate -- tap-name then PIN-pad, real /api/login */
#gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); }
.gate-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 8px 30px rgba(20,17,13,0.08); padding: 34px 30px; width: 100%; max-width: 380px; text-align: center; }
.gate-brand-mark { width: 44px; height: 44px; border-radius: 8px; margin: 0 auto 12px; background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%); display: flex; align-items: center; justify-content: center; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 20px; color: #fff; }
.gate-brand { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 21px; }

.gate-pin-dots { display: flex; gap: 10px; justify-content: center; margin: 22px 0; }

.gate-back { margin-top: 16px; font-size: 12px; color: var(--dim); cursor: pointer; }

function renderInbox() {
  const canAll = userCanSee('inbox_all');
  let threads = THREADS.slice();
  if (!canAll) threads = threads.filter(t => t.assigned === CURRENT_USER.id);
  if (INBOX_FILTER.platform !== 'all') threads = threads.filter(t => t.platform === INBOX_FILTER.platform);
  if (INBOX_FILTER.account !== 'all') threads = threads.filter(t => t.account === INBOX_FILTER.account);
  if (INBOX_FILTER.loc !== 'all') threads = threads.filter(t => t.loc === INBOX_FILTER.loc);
  if (INBOX_FILTER.assigned !== 'all') {
    if (INBOX_FILTER.assigned === 'unassigned') threads = threads.filter(t => !t.assigned);
    else threads = threads.filter(t => t.assigned === INBOX_FILTER.assigned);
  }
  // sort: unread first, then by recency (time string approximation)
  threads.sort((a, b) => {
    if (a.unread !== b.unread) return b.unread - a.unread;
    return 0;
  });

  const unreadCount = THREADS.filter(t => t.unread).length;

  const queuedCount = THREADS.filter(t => t.intent === 'auto_queued').length;
  const followupCount = THREADS.filter(t => t.intent === 'auto_followup').length;
  const html = `
    <h3>${t('nav_inbox')}</h3>
    <p class="lead">${unreadCount === 0 ? t('inbox_quiet') : `<b>${unreadCount}</b> ${t('inbox_busy_msgs')} · ${ACCOUNTS.length} ${t('all_accounts').toLowerCase()}`}</p>

    ${queuedCount > 0 || followupCount > 0 ? `
    <div class="card attn" style="border-left:3px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 70%);">
      <div class="card-head" style="margin-bottom:6px;">
        <span style="font-family:var(--label); font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:0.6px; color:var(--accent-deep);">${t('auto_reply_card')}</span>
        <span style="font-family:var(--label); font-weight:700; font-size:11px; color:var(--dim);">${queuedCount} ${t('auto_reply_queue').toLowerCase()}</span>
      </div>
      <div style="font-size:12px; color:var(--dim); line-height:1.5;">${t('auto_reply_intro')}</div>
    </div>
    ` : ''}

    <div class="scroll-x" style="margin-bottom:8px;">
      <div style="display:inline-block;">
        ${renderPillFilter('platform', 'all', t('all_accounts'))}
        ${['fb','ig','tt','ou','em','gb','wa'].map(p => renderPillFilter('platform', p, p.toUpperCase())).join('')}
      </div>
    </div>
    <div class="scroll-x" style="margin-bottom:12px;">
      <div style="display:inline-block;">
        ${renderPillFilter('loc', 'all', 'All locations')}
        ${renderPillFilter('loc', 'sa', 'San Antonio only')}
        ${renderPillFilter('loc', 'out', 'Out-of-area')}
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
      <select class="select" style="width:auto; flex:1; min-width:160px;" onchange="INBOX_FILTER.account=this.value; renderInbox();">
        <option value="all">${t('all_accounts')}</option>
        ${ACCOUNTS.map(a => `<option value="${a.id}" ${INBOX_FILTER.account === a.id ? 'selected' : ''}>${a.label}</option>`).join('')}
      </select>
      ${canAll ? `
      <select class="select" style="width:auto; flex:1; min-width:160px;" onchange="INBOX_FILTER.assigned=this.value; renderInbox();">
        <option value="all">${t('filter_assigned')}: ${t('all_accounts').toLowerCase()}</option>
        <option value="unassigned">${t('filter_assigned')}: ${t('msg_unassigned')}</option>
        ${USERS.filter(u => u.role !== 'delivery' && u.role !== 'warehouse').map(u => `<option value="${u.id}" ${INBOX_FILTER.assigned === u.id ? 'selected' : ''}>${t('filter_assigned')}: ${u.name}</option>`).join('')}
      </select>
      ` : ''}
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      ${threads.length === 0 ? `<div class="empty">${t('no_threads')}</div>` : threads.map(th => renderThread(th)).join('')}
    </div>
  `;
  document.getElementById('view-inbox').innerHTML = html;
}

function renderPillFilter(field, val, label) {
  const on = INBOX_FILTER[field] === val;
  return `<button class="pill-filter ${on ? 'on' : ''}" onclick="INBOX_FILTER.${field}='${val}'; renderInbox();">${label}</button>`;
}

function renderThread(th) {
  const acct = ACCOUNTS.find(a => a.id === th.account);
  const assignee = th.assigned ? USERS.find(u => u.id === th.assigned) : null;
  const locBadge = th.loc === 'sa'

    : th.loc === 'out'
      ? '<span class="badge" style="background:#fae6dc; color:#a04020;">OUT-OF-AREA</span>'

  const intentBadge = {
    serious_lead: `<span class="badge primary">${t('serious_lead')}</span>`,
    finance_q: `<span class="badge info">${t('finance_q')}</span>`,
    delivery_q: `<span class="badge info">${t('delivery_q')}</span>`,
    price_q: `<span class="badge">${t('price_q')}</span>`,
    spam: `<span class="badge danger">${t('spam')}</span>`,
    follow_up_due: `<span class="badge warning">${t('follow_up_due')}</span>`,
    review_good: `<span class="badge success">★★★★★</span>`,
    review_bad: `<span class="badge danger">★</span>`,
    auto_queued: `<span class="badge" style="background:var(--accent-soft); color:var(--accent-deep);">${t('auto_reply_queue')} · ${t('fires_in')} ${th.auto_reply ? th.auto_reply.fires_in : 30}${t('sec')}</span>`,
    auto_followup: `<span class="badge" style="background:var(--accent); color:white;">⚡ ${t('auto_followup')}</span>`
  }[th.intent] || '';
  return `
    <div class="thread ${th.unread ? 'unread' : ''}" onclick="openThread('${th.id}')">
      <div class="thread-body">
        <div class="thread-l1">
          <span class="plat ${th.platform}">${th.platform.toUpperCase()}</span>

      <div class="thread-time">${th.time}</div>

  `;
}

function generateDraftReply(th) {
  if (th.intent === 'price_q' && th.lang === 'es') {
    return `Hola ${th.customer.split(' ')[0]}, sí lo tenemos en stock. El precio es $1,299 y manejamos financiamiento sin crédito desde $50/mes. ¿Te paso fotos o cuándo puedes venir a verlo?`;
  }
  if (th.intent === 'price_q' && th.lang === 'en') {
    return `Hi ${th.customer.split(' ')[0]}, yes — still available. Price is $1,299 and we offer no-credit financing from $50/month. Want me to send photos or schedule a viewing?`;
  }
  if (th.intent === 'finance_q' && th.lang === 'en') {
    return `Hi ${th.customer.split(' ')[0]} — we work with American Finance, Acima, and Snap. We can pre-qualify in 60 seconds and it doesn't affect your credit. Want me to send the link?`;
  }
  if (th.intent === 'finance_q' && th.lang === 'es') {
    return `Hola ${th.customer.split(' ')[0]} — financiamos con American Finance, Acima y Snap. Te puedo pre-aprobar en 60 segundos y no afecta tu crédito. ¿Te paso el enlace?`;
  }
  if (th.intent === 'delivery_q' && th.lang === 'es') {
    return `Sí, entregamos en esa zona. La entrega es $49 e instalamos sin costo. ¿Qué día te queda mejor?`;
  }
  if (th.intent === 'delivery_q' && th.lang === 'en') {
    return `Yes, we deliver to that area. Delivery is $49 and we set up at no extra cost. What day works for you?`;
  }
  if (th.intent === 'review_bad') {
    return `${th.customer}, I'm so sorry the delivery experience didn't meet expectations. I'm the owner — can I call you directly to make this right? Please reply with the best time and I'll personally handle it.`;
  }
  if (th.intent === 'review_good') {
    return `Thank you so much, ${th.customer}! Christian will love hearing this. We appreciate your business and look forward to seeing you again.`;
  }
  return `Hi ${th.customer.split(' ')[0]}, thanks for reaching out. Can you tell me a bit more about what you're looking for?`;
}

function openReviewReply(id) {
  openThread(id);
}

/* ============================================================
   EASY ORDER VIEW — iPad walkaround mode. Salesperson is on the floor
   with the customer, taps SKUs to build a cart, then "Save & checkout"
   routes into the standard invoice flow (cash / card / finance).
   ============================================================ */
// Real product catalog (602 real items scraped from 210discountfurniture.com,
// see GET /api/catalog) -- the Order/walkaround and New Invoice flows browse
// this, not the old INVENTORY demo constant, so a real sale references a
// real product slug the backend can actually save an order against.
let REAL_CATALOG = { products: null, loading: false, error: null };
async function loadCatalog() {
  REAL_CATALOG.loading = true;
  REAL_CATALOG.error = null;
  try {
    const res = await api('/api/catalog');
    REAL_CATALOG.products = res.products || [];
  } catch (e) {
    REAL_CATALOG.error = e.message || String(e);
  }
  REAL_CATALOG.loading = false;
  if (CURRENT_VIEW === 'order') renderOrder();
}
function catalogFind(slug) { return (REAL_CATALOG.products || []).find(p => p.slug === slug); }

let ORDER_CART = { items: [], search: '', cat: 'all' };
function renderOrder() {
  if (!userCanSee('inventory_read')) {
    document.getElementById('view-order').innerHTML = `<div class="empty">${t('permissions')} — needs <code>inventory_read</code></div>`;
    return;
  }
  if (REAL_CATALOG.products === null && !REAL_CATALOG.loading && !REAL_CATALOG.error) { loadCatalog(); }
  if (REAL_CATALOG.loading && REAL_CATALOG.products === null) {
    document.getElementById('view-order').innerHTML = `<div class="empty">Loading the real catalog...</div>`;
    return;
  }
  if (REAL_CATALOG.error) {
    document.getElementById('view-order').innerHTML = `<div class="empty">Could not load the catalog: ${REAL_CATALOG.error}</div><button class="btn ghost" onclick="loadCatalog()">Retry</button>`;
    return;
  }
  const catalog = REAL_CATALOG.products || [];
  const q = (ORDER_CART.search || '').toLowerCase();
  let items = catalog.map(p => ({ slug: p.slug, sku: p.sku, name: p.name, price: p.price, cat: (p.category_path && p.category_path[0]) || 'other' }));
  if (ORDER_CART.cat !== 'all') items = items.filter(i => i.cat === ORDER_CART.cat);
  if (q) items = items.filter(i => i.name.toLowerCase().includes(q) || (i.sku || '').toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));
  const cats = [...new Set(catalog.map(p => (p.category_path && p.category_path[0]) || 'other'))].sort();
  const cartTotal = ORDER_CART.items.reduce((s, x) => s + x.price * x.qty, 0);
  const cartCount = ORDER_CART.items.reduce((s, x) => s + x.qty, 0);

  const html = `
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:6px;">
      <h3 style="margin:0;">Easy order · walkaround</h3>
      ${cartCount > 0 ? `<span class="badge primary" style="font-size:12px;">Cart: ${cartCount} item${cartCount === 1 ? '' : 's'} · $${cartTotal.toLocaleString()}</span>` : ''}
    </div>
    <p class="lead">Walking the floor with a customer? Tap a SKU to add it. When they're ready, hit Checkout — same payment + signature + print flow as any other sale.</p>

    <div class="field">
      <input class="input" placeholder="Search by name, SKU, or category..." value="${ORDER_CART.search}" oninput="ORDER_CART.search=this.value; renderOrder();" style="font-size:16px; padding:14px 16px;" autofocus>
    </div>

    <div class="scroll-x" style="margin-bottom:14px;">
      <div style="display:inline-block;">
        <button class="pill-filter ${ORDER_CART.cat === 'all' ? 'on' : ''}" onclick="ORDER_CART.cat='all'; renderOrder();">All</button>
        ${cats.map(c => `<button class="pill-filter ${ORDER_CART.cat === c ? 'on' : ''}" onclick="ORDER_CART.cat='${c}'; renderOrder();">${c}</button>`).join('')}
      </div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; margin-bottom:90px;">
      ${items.length === 0 ? `<div class="empty" style="grid-column:1/-1;">No products match.</div>` : items.map(i => {
        const inCart = ORDER_CART.items.find(x => x.slug === i.slug);
        return `
          <div onclick="orderAddItem('${i.slug}')" style="background:var(--surface); border:0.5px solid ${inCart ? 'var(--primary)' : 'var(--border)'}; ${inCart ? 'box-shadow:0 0 0 2px var(--primary-soft);' : ''} border-radius:10px; padding:10px; cursor:pointer; min-height:100px; display:flex; flex-direction:column; gap:6px; position:relative;">
            ${inCart ? `<div style="position:absolute; top:6px; right:6px; background:var(--primary); color:white; font-family:var(--label); font-weight:700; font-size:11px; padding:2px 8px; border-radius:10px;">×${inCart.qty}</div>` : ''}
            <div style="font-family:var(--label); font-weight:700; font-size:11px; color:var(--dim); text-transform:uppercase;">${i.cat.replace(/-/g, ' ')}</div>
            <div style="font-weight:600; font-size:13px; line-height:1.25; flex:1;">${i.name}</div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
              <span style="font-family:var(--mono); font-size:10px; color:var(--dim);">${i.sku || ''}</span>
              <span style="font-family:var(--mono); font-weight:700; font-size:16px;">$${i.price.toLocaleString()}</span>
            </div>
          </div>`;
      }).join('')}
    </div>

    ${ORDER_CART.items.length > 0 ? `
      <div style="position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); padding:12px 16px; box-shadow:0 -4px 20px rgba(20,17,13,0.08); z-index:40;">
        <div style="max-width:1080px; margin:0 auto; display:flex; gap:10px; align-items:center;">
          <div style="flex:1;">
            <div style="font-family:var(--label); font-weight:700; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:0.8px;">Cart · ${cartCount} items</div>
            <div style="font-family:var(--mono); font-weight:700; font-size:20px;">$${cartTotal.toLocaleString()}</div>
          </div>
          <button class="btn ghost" onclick="orderViewCart()">Review cart</button>
          <button class="btn primary" onclick="orderCheckout()">Checkout →</button>
        </div>
      </div>
    ` : ''}
  `;
  document.getElementById('view-order').innerHTML = html;
}

function orderAddItem(slug) {
  const it = catalogFind(slug);
  if (!it) return;
  const ex = ORDER_CART.items.find(x => x.slug === slug);
  if (ex) ex.qty += 1;
  else ORDER_CART.items.push({ slug: it.slug, sku: it.sku, name: it.name, price: it.price, qty: 1 });
  renderOrder();
}

function orderViewCart() {
  if (ORDER_CART.items.length === 0) return;
  const total = ORDER_CART.items.reduce((s, x) => s + x.price * x.qty, 0);
  openModal(`
    <div class="modal-head">
      <div>
        <div style="font-weight:600; font-size:16px;">Review cart</div>
        <div style="font-family:var(--label); font-weight:700; font-size:10px; color:var(--dim); margin-top:2px; text-transform:uppercase; letter-spacing:0.6px;">${ORDER_CART.items.length} SKUs · ${ORDER_CART.items.reduce((s,x)=>s+x.qty,0)} units</div>
      </div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    ${ORDER_CART.items.map((x, idx) => `
      <div style="display:flex; gap:8px; padding:10px 0; border-bottom:0.5px solid var(--border-soft); align-items:center;">
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:600;">${x.name}</div>
          <div style="font-family:var(--label); font-weight:600; font-size:11px; color:var(--dim);">${x.sku} · $${x.price} each</div>
        </div>
        <button onclick="orderDec(${idx})" style="width:30px; height:30px; border-radius:15px; border:0.5px solid var(--border); background:var(--surface); cursor:pointer; font-size:18px; line-height:1;">−</button>
        <div style="min-width:28px; text-align:center; font-family:var(--mono); font-weight:700; font-size:15px;">${x.qty}</div>
        <button onclick="orderInc(${idx})" style="width:30px; height:30px; border-radius:15px; border:0.5px solid var(--primary); background:var(--primary); color:white; cursor:pointer; font-size:18px; line-height:1;">+</button>
        <div style="min-width:70px; text-align:right; font-family:var(--mono); font-weight:700; font-size:15px;">$${(x.price * x.qty).toLocaleString()}</div>
      </div>
    `).join('')}
    <div style="display:flex; justify-content:space-between; padding:14px 0 8px; border-top:2px solid var(--ink); margin-top:8px;">
      <span style="font-weight:700; font-size:15px;">TOTAL</span>
      <span style="font-family:var(--mono); font-weight:700; font-size:22px;">$${total.toLocaleString()}</span>
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn primary" style="flex:2;" onclick="closeModal(); orderCheckout();">Checkout →</button>
      <button class="btn ghost" onclick="closeModal()">Keep shopping</button>
    </div>
    <button class="btn ghost full" style="margin-top:8px; color:var(--danger);" onclick="if(confirm('Clear the cart?')){ ORDER_CART.items = []; closeModal(); renderOrder(); }">Clear cart</button>
  `);
}
function orderInc(idx) { ORDER_CART.items[idx].qty += 1; orderViewCart(); }
function orderDec(idx) {
  ORDER_CART.items[idx].qty -= 1;
  if (ORDER_CART.items[idx].qty <= 0) ORDER_CART.items.splice(idx, 1);
  if (ORDER_CART.items.length === 0) { closeModal(); renderOrder(); }
  else orderViewCart();
}
function orderCheckout() {
  if (ORDER_CART.items.length === 0) return;
  // Hand the cart off to the standard new-invoice flow
  NEW_INV = { items: ORDER_CART.items.slice(), customer: '', phone: '', email: '', method: 'cash', addr: '', search: '', deposit: null, supplier: 'In stock' };
  ORDER_CART = { items: [], search: '', cat: 'all' };
  renderNewInvoice();
}

function addInvItem(slug) {
  const it = catalogFind(slug);
  if (!it) return;
  const ex = NEW_INV.items.find(x => x.slug === slug);
  if (ex) ex.qty += 1;
  else NEW_INV.items.push({ slug: it.slug, sku: it.sku, name: it.name, price: it.price, qty: 1 });
  renderNewInvoice();
}
function incInvItem(idx) { NEW_INV.items[idx].qty += 1; renderNewInvoice(); }
function decInvItem(idx) {
  NEW_INV.items[idx].qty -= 1;
  if (NEW_INV.items[idx].qty <= 0) NEW_INV.items.splice(idx, 1);
  renderNewInvoice();
}
// Real backend save -- creates/finds the customer, then a real order
// (deposit / balance-due ledger, see worker/src/lib/orders.ts). This is
// what makes a sale actually persist instead of only living in the
// in-browser INVOICES array. Both the cash/card path (finalizeNewInvoice)
// and the financed path (completeFinancedSale) call this.
async function saveRealOrder(items, depositAmount, supplier) {
  const customerName = NEW_INV.customer || 'Walk-in customer';
  const custRes = await api('/api/customers', {
    method: 'POST',
    body: JSON.stringify({ name: customerName, phone: NEW_INV.phone || undefined, email: NEW_INV.email || undefined }),
  });
  const totalAmount = items.reduce((s, x) => s + x.price * x.qty, 0);
  const productSlugs = items.map(x => x.slug).filter(Boolean);
  const orderRes = await api('/api/orders', {
    method: 'POST',
    body: JSON.stringify({
      customer_id: custRes.customer.id,
      customer_name: customerName,
      product_slugs: productSlugs,
      total_amount: totalAmount,
      deposit_amount: depositAmount,
      supplier: supplier || 'In stock',
    }),
  });
  return orderRes.order;
}

async function finalizeNewInvoice(ev) {
  if (NEW_INV.items.length === 0) return;
  // If finance method selected, route through the finance application flow first
  if (NEW_INV.method && NEW_INV.method.startsWith('finance_')) {
    openFinanceApp(NEW_INV.method);
    return;
  }
  const total = NEW_INV.items.reduce((s,x) => s + x.price * x.qty, 0);
  const depositAmount = (NEW_INV.deposit !== null && NEW_INV.deposit !== '') ? Number(NEW_INV.deposit) : total;
  const btn = ev && ev.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  let order;
  try {
    order = await saveRealOrder(NEW_INV.items, depositAmount, NEW_INV.supplier);
  } catch (e) {
    alert('Could not save this sale to the real system: ' + (e.message || e) + '\n\nNothing was recorded -- please try again before handing over a receipt.');
    if (btn) { btn.disabled = false; btn.textContent = t('save_invoice') + ' · $' + total.toLocaleString(); }
    return;
  }
  // Real order saved -- build the same local shape the existing print/
  // post-sale flow already expects, keyed to the real order's real id.
  const inv = {
    id: order.id,
    date: TODAY,
    customer: NEW_INV.customer || 'Walk-in customer',
    cust_id: order.customer_id,
    total,
    items: NEW_INV.items.slice(),
    method: NEW_INV.method,
    status: NEW_INV.method === 'cash' ? 'paid' : NEW_INV.method === 'card' ? 'paid' : 'pending',
    source: 'digital',
    signed: false,
    deliv_addr: NEW_INV.addr || 'Pickup',
    salesperson: CURRENT_USER.id
  };
  INVENTORY_LAST_NEW = inv;
  INVOICES.unshift(inv);
  closeModal();
  // Immediately offer print + confirmation
  setTimeout(() => openPostSaleActions(inv), 100);
}

async function completeFinancedSale(ev) {
  const total = NEW_INV.items.reduce((s,x) => s + x.price * x.qty, 0);
  // How much the lender is actually covering -- full total if approved,
  // the lender's cap if it was a partial/counter approval (see step 5 of
  // renderFinanceApp -- same math, recomputed here since that step's
  // locals aren't persisted on FINANCE_APP).
  const financedAmount = Math.min(total, FINANCE_APP.lender.cap);
  const btn = ev && ev.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  let order;
  try {
    order = await saveRealOrder(NEW_INV.items, financedAmount, NEW_INV.supplier);
  } catch (e) {
    alert('Could not save this sale to the real system: ' + (e.message || e) + '\n\nNothing was recorded -- please try again before handing over a receipt.');
    if (btn) { btn.disabled = false; btn.textContent = 'Finalize sale · print receipt'; }
    return;
  }
  const inv = {
    id: order.id,
    date: TODAY,
    customer: NEW_INV.customer || 'Walk-in customer',
    cust_id: order.customer_id,
    total,
    items: NEW_INV.items.slice(),
    method: NEW_INV.method,
    status: 'finance',
    source: 'digital',
    signed: false,
    deliv_addr: NEW_INV.addr || 'Pickup',
    salesperson: CURRENT_USER.id
  };
  INVOICES.unshift(inv);
  closeModal();
  setTimeout(() => openPostSaleActions(inv), 100);
}

/* Full CSV export — name, phone, email, last_purchase, lifetime_spend, source, tags.
   Respects the active segment so you get just VIPs / just recents / etc.
   Ready to upload to Mailchimp, Constant Contact, Klaviyo. */
function downloadCustomersCSV(seg) {
  const list = filterCustomersBySegment(seg);
  const headers = ['Name', 'First Name', 'Last Name', 'Phone', 'Email', 'Last Purchase', 'Lifetime Spend', 'Source', 'Tags'];
  const rows = [headers];
  list.forEach(c => {
    const parts = c.name.split(' ');
    const first = parts[0] || '';
    const last = parts.slice(1).join(' ') || '';
    rows.push([c.name, first, last, c.phone || '', c.email || '', c.last, c.spent, c.source, c.tags.join(';')]);
  });
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell == null ? '' : cell);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  triggerDownload(csv, `210-customers-${seg}-${TODAY}.csv`, 'text/csv;charset=utf-8');
}

/* Plain emails one per line — fastest path to Gmail BCC or any TXT-import marketing tool */
function downloadEmailsTxt(seg) {

function downloadPhonesTxt(seg) {

/* Shared helper — creates a download blob, clicks it, cleans up */
function triggerDownload(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadFinancialsCSV() {
  const rows = [];
  rows.push(['# 210 Discount Furniture — Financials report']);
  rows.push(['# Generated', new Date().toISOString()]);
  rows.push(['# Period', 'Last 30 days ending ' + TODAY]);
  rows.push([]);
  rows.push(['== AD SPEND BY CHANNEL ==']);
  rows.push(['Channel','Spend','Revenue','Leads','Sales','ROAS']);
  ADS.forEach(a => rows.push([a.channel, a.spend, a.revenue, a.leads, a.attributed_sales, a.spend > 0 ? (a.revenue/a.spend).toFixed(2) : 'INF']));
  rows.push([]);
  rows.push(['== PER-ACCOUNT BREAKDOWN ==']);
  rows.push(['Account','Spend','Messages','Sales','Revenue','ROAS','CAC']);
  const acctData = [
    ['210 Discount Furniture (FB)', 1850, 38, 7, 8900],
    ['210 Discount Mattress (FB)', 920, 19, 4, 4400],
    ['210 Muebles en Español (FB)', 780, 22, 5, 5200],
    ['210 Furniture Outlet (FB)', 410, 9, 2, 1900],
    ['FB Marketplace · SA', 0, 51, 5, 4200],
    ['@210discount (IG)', 1800, 58, 7, 7200],
    ['@210discountfurniture (TT)', 600, 47, 1, 1100],
    ['@210mueblesatx (TT)', 300, 26, 1, 700],
    ['OfferUp', 0, 33, 3, 2400],
    ['Google Search Ads', 2400, 41, 9, 9600],
    ['Google Business Profile (free)', 0, 28, 6, 5400]
  ];
  acctData.forEach(([a, sp, m, s, r]) => {
    const roas = sp > 0 ? (r/sp).toFixed(2) : 'INF';
    const cac = s > 0 ? Math.round(sp/s) : 0;
    rows.push([a, sp, m, s, r, roas, cac]);
  });
  rows.push([]);
  rows.push(['== PER-REP PERFORMANCE ==']);
  rows.push(['Rep','Role','Messages','Sales','Gross','Avg Ticket']);
  USERS.forEach(u => {
    const invs = INVOICES.filter(i => i.salesperson === u.id);
    const gross = invs.reduce((s, i) => s + i.total, 0);
    const msgs = THREADS.filter(t => t.assigned === u.id).length;
    rows.push([u.name, u.role, msgs, invs.length, gross, invs.length > 0 ? Math.round(gross/invs.length) : 0]);
  });
  rows.push([]);
  rows.push(['== INVOICES ==']);
  rows.push(['Invoice ID','Date','Customer','Items','Total','Method','Status','Source','Salesperson']);
  INVOICES.forEach(i => rows.push([i.id, i.date, i.customer, i.items.length, i.total, i.method, i.status, i.source, i.salesperson]));
  if (userCanSee('money')) {
    rows.push([]);
    rows.push(['== CASH POSITION (owner-only) ==']);
    rows.push(['Bank balance', BANK.balance]);
    rows.push(['Pending vendor payments', BANK.pending_payments]);
    rows.push(['Scheduled 30-day outflow', BANK.scheduled_outflow_30d]);
    rows.push(['Total invoice revenue', INVOICES.reduce((s,i) => s+i.total, 0)]);
  }
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell == null ? '' : cell);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '210-cockpit-financials-' + TODAY + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Real call to the worker (item 3) -- POST /api/reels/generate. Sends the
// promo theme + script + the real uploaded photo (as a data URL); the
// server generates bilingual captions via Anthropic every time, and
// starts a real fal.ai image-to-video job (same fal.ai pipeline used for
// the Goldenberg/Hollywood Ice Cream Co. proposal) when a photo is
// attached and FAL_KEY is configured server-side (fixed 2026-09-10).
async function runReelGenerate() {
  var btn = document.getElementById("reels-generate-btn");
  var out = document.getElementById("reels-generate-result");
  if (!REEL_STATE.uploadedImage) {
    if (out) out.textContent = "Upload a real furniture photo above first -- video needs a real photo to animate.";
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = "Generating..."; }
  if (out) out.textContent = "";
  REEL_STATE.videoUrl = null;
  REEL_STATE.videoStage = "starting";
  var stillGenerating = true;
  try {
    var body = {
      theme: REEL_STATE.theme,
      script: REEL_STATE.script || sampleScript(REEL_STATE.theme),
      imageDataUrl: REEL_STATE.uploadedImage,
    };
    var result = await api("/api/reels/generate", { method: "POST", body: JSON.stringify(body) });
    if (result.captions) REEL_STATE.captions = result.captions;
    if (out) {
      out.textContent = "EN: " + (result.captions ? result.captions.en : "") + "\n\nES: " + (result.captions ? result.captions.es : "") + "\n\n" + (result.message || "");
    }
    if (result.configured && result.jobId) {
      REEL_STATE.videoStage = "rendering";
      stillGenerating = false; // pollReelStatus owns the button from here on
      renderReels();
      pollReelStatus(result.jobId, out, btn);
    } else {
      REEL_STATE.videoStage = null;
    }
  } catch (e) {
    if (out) out.textContent = "Reel generation failed: " + e.message;
    REEL_STATE.videoStage = null;
  } finally {
    if (stillGenerating && btn) { btn.disabled = false; btn.textContent = t("reels_generate"); }
  }
}

// Polls the real fal.ai job via GET /api/reels/status/:jobId until it
// settles (done/error) -- same submit->poll->fetch shape proven for
// Kostya Studio and the Goldenberg proposal's video pipeline.
async function pollReelStatus(jobId, out, btn) {
  if (btn) btn.textContent = "Rendering video...";
  var attempts = 0;
  var maxAttempts = 40; // ~2 minutes at 3s intervals
  while (attempts < maxAttempts) {
    attempts++;
    await new Promise(function(r) { setTimeout(r, 3000); });
    try {
      var job = await api("/api/reels/status/" + jobId, { method: "GET" });
      if (job.stage === "done" && job.videoUrl) {
        REEL_STATE.videoUrl = job.videoUrl;
        REEL_STATE.videoStage = "done";
        if (out) out.textContent = (out.textContent || "") + "\n\nVideo ready.";
        renderReels();
        break;
      } else if (job.stage === "error") {
        REEL_STATE.videoStage = "error";
        if (out) out.textContent = (out.textContent || "") + "\n\nVideo generation failed: " + (job.error || "unknown error");
        renderReels();
        break;
      }
      // still rendering -- keep polling
    } catch (e) {
      REEL_STATE.videoStage = "error";
      if (out) out.textContent = (out.textContent || "") + "\n\nLost track of the video job: " + e.message;
      renderReels();
      break;
    }
  }
  if (attempts >= maxAttempts && REEL_STATE.videoStage === "rendering") {
    REEL_STATE.videoStage = "error";
    if (out) out.textContent = (out.textContent || "") + "\n\nVideo is taking longer than expected -- check back or try again.";
    renderReels();
  }
  if (btn) { btn.disabled = false; btn.textContent = t("reels_generate"); }
}

// One-click-as-possible publish: no platform is actually connected yet
// (Facebook/Instagram/TikTok Business auth not done -- see the Connect
// card), so this copies the caption to the clipboard and opens the right
// platform in a new tab, same pattern already proven for Igor HQ. Instagram
// specifically has no public web "compose post" URL (confirmed dead end),
// so the best real option is to land on instagram.com already logged in,
// ready to tap the + button -- not a full one-click post, but copy+paste
// instead of retyping the caption by hand.
const PUBLISH_URLS = {
  facebook: 'https://www.facebook.com/',
  instagram: 'https://www.instagram.com/',
  tiktok: 'https://www.tiktok.com/upload',
  youtube: 'https://www.youtube.com/upload',
};
function publishReelTo(platform) {
  var out = document.getElementById('reels-publish-result');
  var caps = REEL_STATE.captions;
  if (!caps) {
    if (out) out.textContent = 'Generate a reel first -- there\'s no caption to copy yet.';
    return;
  }
  var caption = caps.en + (caps.es ? '\n\n' + caps.es : '');

  try {

    if (out) out.textContent = 'Caption copied. ' + (opened ? 'Opened ' + platform + ' -- paste the caption and attach your video/photo.' : (platform + ' didn\'t open (popup blocked) -- go there manually and paste.'));

  }
}

// Real static ad-graphic generator -- client-side Canvas, same cover-fit +
// gradient-overlay + text-wrap technique already proven live in Igor HQ's
// drawGraphic(). Answers "make ads from pictures of furniture" directly:
// produces a real downloadable branded image (not a mockup), usable as a
// Facebook/Instagram feed post or as creative in Meta/TikTok Ads Manager
// once those accounts are connected -- doesn't need any account connected
// to generate the image itself.
function wrapCanvasText(ctx, text, x, y, maxW, lineH) {
  if (!text) return y;
  var words = text.split(' ');
  var line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      y += lineH;
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y); y += lineH; }
  return y;
}
function loadImageEl(src) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.onload = function() { resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}
async function generateAdGraphic() {
  var out = document.getElementById('ad-graphic-result');
  var cv = document.getElementById('ad-graphic-canvas');
  var dlBtn = document.getElementById('ad-graphic-download');
  if (!REEL_STATE.uploadedImage) {
    if (out) out.textContent = 'Upload a real furniture photo above first.';
    return;
  }
  if (out) out.textContent = 'Building graphic...';
  var W = cv.width, H = cv.height;
  var ctx = cv.getContext('2d');
  try {
    var img = await loadImageEl(REEL_STATE.uploadedImage);
    var scale = Math.max(W / img.width, H / img.height);
    var sw = img.width * scale, sh = img.height * scale;
    var sx = (W - sw) / 2, sy = (H - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh);

    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(20,10,5,0.15)');
    grad.addColorStop(0.55, 'rgba(20,10,5,0.55)');
    grad.addColorStop(1, 'rgba(20,10,5,0.92)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var pad = Math.round(W * 0.07);

    // Brand bar, top
    ctx.fillStyle = '#fff';
    ctx.font = '800 ' + Math.round(W * 0.045) + 'px Georgia, serif';
    ctx.textBaseline = 'top';
    ctx.fillText('210 DISCOUNT FURNITURE', pad, pad * 0.7);

    // Promo tag pill

// Conversion proof -- opens the device camera directly (capture=environment
// on an iPad/phone means the OS camera app opens immediately, no gallery
// step) and uploads the moment a photo is taken, then refreshes so the
// message-handler leaderboard reflects it. No photo needed at all is also
// supported (markWonNoPhoto) for a desktop/no-camera fallback.
function markWonWithReceipt(threadId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await api('/api/threads/mark-won', { method: 'POST', body: JSON.stringify({ thread_id: threadId, photo_data_url: reader.result }) });
        await refreshLiveData();
      } catch (err) {
        alert('Could not save: ' + err.message);
      }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
async function markWonNoPhoto(threadId) {
  try {
    await api('/api/threads/mark-won', { method: 'POST', body: JSON.stringify({ thread_id: threadId }) });
    await refreshLiveData();
  } catch (err) {
    alert('Could not save: ' + err.message);
  }
}

function formatDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  if (LANG === 'es') {
    const days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
  } else if (LANG === 'ru') {
    const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
  } else {
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }
}

/* -------- NOTIFICATIONS --------
   Per-user ON/OFF toggle (persisted in localStorage). When ON the cockpit
   shows in-app toasts for every new message, fires a browser Notification
   if permission granted, and vibrates the device on supported mobile.
   When OFF (e.g. team member is off-shift) — total silence. */
const NOTIFY_KEY_PREFIX = 'cockpit.notify.';
function notifyIsOn() {
  const v = localStorage.getItem(NOTIFY_KEY_PREFIX + CURRENT_USER.id);
  return v === null ? true : v === '1';  // default ON
}
function setNotifyState(on) {
  localStorage.setItem(NOTIFY_KEY_PREFIX + CURRENT_USER.id, on ? '1' : '0');
  paintNotifyButton();
}
function paintNotifyButton() {
  const btn = document.getElementById('notif-toggle');
  const lbl = document.getElementById('notif-label');
  if (!btn) return;
  const on = notifyIsOn();
  btn.classList.toggle('off', !on);
  if (lbl) lbl.textContent = on ? 'ON' : 'OFF';
  btn.title = on ? 'Notifications ON · click to mute when you leave work' : 'Notifications OFF · click to turn back on';
}
async function toggleNotifications() {
  const on = !notifyIsOn();
  setNotifyState(on);
  if (on) {
    // Request browser notification permission once (so it can fire when the tab is in background)
    if ('Notification' in window && Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch (e) {}
    }
    showToast({ kind: 'system', title: 'Notifications turned ON', preview: "You'll be pinged for every incoming message across all 13 accounts. Tap the bell again to mute when you leave work." });
    // Fire a demo notification after 4 seconds to show what it looks like
    setTimeout(() => simulateIncomingMessage(), 4000);
  } else {
    showToast({ kind: 'system', title: 'Notifications turned OFF', preview: 'Total silence. Re-enable from the bell icon anytime.' });
  }
}
function showToast(opts) {
  // opts: { kind: 'system'|'message', title, preview, threadId?, account?, customer? }
  const container = document.getElementById('toasts');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    <div class="toast-bell">${opts.kind === 'system' ? '⚙' : '🔔'}</div>
    <div class="toast-body">
      ${opts.account ? `<div class="toast-meta">${opts.account}</div>` : ''}
      <div class="toast-title">${opts.title}</div>
      <div class="toast-preview">${opts.preview}</div>
      ${opts.threadId ? `
        <div class="toast-actions">
          <button class="toast-btn" onclick="setView('inbox'); setTimeout(() => openThread('${opts.threadId}'), 50); this.closest('.toast').remove();">Open</button>
          <button class="toast-btn ghost" onclick="this.closest('.toast').remove();">Dismiss</button>
        </div>
      ` : ''}
    </div>
  `;
  container.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity 0.4s, transform 0.4s'; el.style.opacity = '0'; el.style.transform = 'translateX(420px)'; setTimeout(() => el.remove(), 400); }, opts.kind === 'system' ? 5000 : 8000);
}
function simulateIncomingMessage() {
  if (!notifyIsOn()) return;
  // Pick a realistic-looking unread thread to use as the simulated new message
  const samples = THREADS.filter(t => t.unread && t.intent !== 'spam');
  const th = samples[Math.floor(Math.random() * samples.length)];
  if (!th) return;
  const acct = ACCOUNTS.find(a => a.id === th.account);
  // In-app toast
  showToast({
    kind: 'message',
    account: acct ? acct.label : '',
    title: 'New message from ' + th.customer,
    preview: th.preview.length > 100 ? th.preview.slice(0, 100) + '…' : th.preview,
    threadId: th.id
  });
  // Browser notification (works even when tab is backgrounded)
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification('New message · ' + (acct ? acct.label : '210 Cockpit'), {
        body: th.customer + ': ' + (th.preview.length > 80 ? th.preview.slice(0, 80) + '…' : th.preview),
        icon: 'icons/icon-192.png',
        tag: 'cockpit-msg-' + th.id,
        renotify: false,
        silent: false
      });
    } catch (e) {}
  }
  // Vibrate on mobile
  if ('vibrate' in navigator) {
    try { navigator.vibrate([180, 80, 120]); } catch (e) {}
  }
}

/* -------- BOOT + PWA -------- */
/* ============================================================
   LOGIN GATE -- real PIN auth against POST /api/login, replacing the old
   demo USERS-switcher perspective toggle. Same tap-name-then-PIN-pad shape
   as feliks-valet-cockpit/web/index.html. Session token persisted in
   localStorage so a reload does not force a re-login; GET /api/me
   revalidates it on boot. API_BASE defaults to same-origin (this file is
   now served by the worker itself, see worker/src/main.ts WEB_DIR) but
   can be overridden for a cross-origin GitHub Pages deploy.
   ============================================================ */
const API_BASE_KEY = "pasha_api_base";
const SESSION_KEY = "pasha_session_token";
let API_BASE = localStorage.getItem(API_BASE_KEY) || "";
let SESSION_TOKEN = null;

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (SESSION_TOKEN) headers.Authorization = "Bearer " + SESSION_TOKEN;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { gateLogout(); throw new Error("Session expired -- please log in again."); }
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {}; }
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

// Real backend roles (worker/src/lib/rbac.ts ROLE_ATOMS) mapped onto the
// legacy perms vocabulary this shell UI already gates every view on
// (userCanSee(...)). The server is the actual boundary (every /api/* route
// checks the real atom); this mapping only drives which demo panels show,
// same "UI convenience, not the boundary" split feliks-valet-cockpit uses.
const ROLE_LEGACY_PERMS = {};
ROLE_LEGACY_PERMS.owner = [];
ROLE_LEGACY_PERMS.owner.push("inbox_all");
ROLE_LEGACY_PERMS.owner.push("inventory_read");

ROLE_LEGACY_PERMS.owner.push("team");
ROLE_LEGACY_PERMS.owner.push("money");
ROLE_LEGACY_PERMS.owner.push("reviews");
ROLE_LEGACY_PERMS["sales-lead"] = [];
ROLE_LEGACY_PERMS["sales-lead"].push("inbox_all");
ROLE_LEGACY_PERMS["sales-lead"].push("inventory_read");
ROLE_LEGACY_PERMS["sales-lead"].push("inventory_write");
ROLE_LEGACY_PERMS["sales-lead"].push("customers");
ROLE_LEGACY_PERMS["sales-lead"].push("customers_email");
ROLE_LEGACY_PERMS["sales-lead"].push("ads");
ROLE_LEGACY_PERMS["sales-lead"].push("reviews");
ROLE_LEGACY_PERMS["showroom-associate"] = [];
ROLE_LEGACY_PERMS["showroom-associate"].push("inbox_assigned");
ROLE_LEGACY_PERMS["showroom-associate"].push("inventory_read");
ROLE_LEGACY_PERMS["showroom-associate"].push("customers");

ROLE_LEGACY_PERMS["delivery-driver"].push("inventory_read");

ROLE_LEGACY_PERMS["read-only"].push("inbox_all");
ROLE_LEGACY_PERMS["read-only"].push("inventory_read");

// Picker shown on the gate -- names/avatars/roles only, no PIN. Mirrors
// worker/src/lib/rbac.ts SHELL_USERS (the real seeded login accounts).
// The PIN typed on the next screen is what actually authenticates against
// POST /api/login.
const LOGIN_PICKER = [];
LOGIN_PICKER.push({ id: "u_paul", name: "Pavil (Pasha)", avatar: "P" });
LOGIN_PICKER.push({ id: "u_ivan", name: "Ivan (advisor)", avatar: "I" });
LOGIN_PICKER.push({ id: "u_rick", name: "Rick (Sales Lead)", avatar: "R" });
LOGIN_PICKER.push({ id: "u_carlos", name: "Carlos", avatar: "C" });
LOGIN_PICKER.push({ id: "u_nick", name: "Nick", avatar: "N" });
LOGIN_PICKER.push({ id: "u_roland", name: "Roland", avatar: "R" });
LOGIN_PICKER.push({ id: "u_ilya", name: "Ilya", avatar: "I" });

let gatePinBuffer = "";
let gatePinTarget = null;

function renderGatePicker() {
  document.getElementById("gate-emp-list").innerHTML = LOGIN_PICKER.map(function(u) {
    return `<button class="gate-emp-btn" onclick='gatePickEmployee(${JSON.stringify(u.id)})'>${u.avatar} -- ${u.name}</button>`;
  }).join("");
}

function gatePickEmployee(id) {
  gatePinTarget = id;
  gatePinBuffer = "";
  document.getElementById("gate-picker").style.display = "none";
  document.getElementById("gate-pin").style.display = "block";
  document.getElementById("gate-error").textContent = "";
  renderGatePinDots();
  var keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  document.getElementById("gate-pin-pad").innerHTML = keys.map(function(k) {
    if (k === "") return "<div></div>";
    var label = k === "del" ? "&larr;" : k;
    return `<button type="button" class="gate-pin-key" onclick='gatePinPress(${JSON.stringify(k)})'>${label}</button>`;
  }).join("");
}

function gateBackToPicker() {
  document.getElementById("gate-picker").style.display = "block";
  document.getElementById("gate-pin").style.display = "none";
}

function renderGatePinDots() {
  var dots = [0, 1, 2, 3];
  document.getElementById("gate-pin-dots").innerHTML = dots.map(function(i) {
    var filled = i < gatePinBuffer.length ? " filled" : "";
    return "<div class=" + JSON.stringify("gate-pin-dot" + filled) + "></div>";
  }).join("");
}

async function gatePinPress(k) {
  if (k === "del") { gatePinBuffer = gatePinBuffer.slice(0, -1); renderGatePinDots(); return; }
  if (gatePinBuffer.length >= 4) return;
  gatePinBuffer += k;
  renderGatePinDots();
  if (gatePinBuffer.length === 4) {
    try {
      var res = await fetch(API_BASE + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId: gatePinTarget, pin: gatePinBuffer }) });
      var data = await res.json().catch(function() { return {}; });
      if (!res.ok) throw new Error(data.error || "Incorrect PIN");
      SESSION_TOKEN = data.token;
      localStorage.setItem(SESSION_KEY, SESSION_TOKEN);
      applyLoggedInUser(data.user, data.atoms);
      await enterApp();
    } catch (e) {
      document.getElementById("gate-error").textContent = "Incorrect PIN";
      gatePinBuffer = "";
      renderGatePinDots();
    }
  }
}

// Real atoms from the server drive CURRENT_USER.perms via the legacy
// mapping above -- CURRENT_USER.atoms is also kept for any new code that
// wants to check a real atom directly instead of a legacy perm string.
function applyLoggedInUser(serverUser, atoms) {
  var legacyPerms = ROLE_LEGACY_PERMS[serverUser.role] || [];
  CURRENT_USER = {
    id: serverUser.id,
    name: serverUser.name,
    role: serverUser.role,
    avatar: serverUser.name.charAt(0),
    perms: legacyPerms,
    atoms: atoms || [],
  };
}

function gateLogout() {
  if (SESSION_TOKEN) { api("/api/logout", { method: "POST" }).catch(function() {}); }
  localStorage.removeItem(SESSION_KEY);
  SESSION_TOKEN = null;
  CURRENT_USER = null;
  location.reload();
}

async function enterApp() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  renderUserSwitcher();
  renderNav();
  renderView();
  var sub = document.getElementById("brand-sub");
  if (sub) sub.textContent = t("brand_sub");
  paintNotifyButton();
}

async function gateBoot() {
  renderGatePicker();
  var saved = localStorage.getItem(SESSION_KEY);
  if (saved) {
    SESSION_TOKEN = saved;
    try {
      var me = await api("/api/me");
      applyLoggedInUser(me.user, me.atoms);
      await enterApp();
      return;
    } catch (e) {
      localStorage.removeItem(SESSION_KEY);
      SESSION_TOKEN = null;
    }
  }
  // gate stays visible, showing the picker
}

gateBoot();

// Service worker registration — enables offline + install prompt
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW reg failed', err));
  });
}

// PWA install prompt capture (Android/Desktop Chrome)
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});
</script>
